# Bonificaciones por raza. El id es el valor del marcador rz_race de tu datapack Razas.
# calidad_oficio: puntos extra de "score" de calidad por oficio
# calidad_estacion: puntos extra al usar una estación concreta
# ahorro: fracción de materiales que NO se gasta, por etiqueta (ver etiquetas_material)
# ahorro_combustible: fracción de carbón ahorrada
# bonus_noche: puntos de calidad extra si es de noche
# bonus_dano: multiplicador extra de daño en ciertas armas (solo si la forja quien tiene la raza)
# bonus_mejora: puntos % extra de éxito al reforzar; bonus_desguace: fracción extra devuelta
razas:
  elfo:
    id: 1
    nombre: "Elfo"
    calidad_oficio: {carpinteria: 8, joyeria: 8}
    ahorro: {}
  enano:
    id: 2
    nombre: "Enano"
    calidad_oficio: {herreria: 10}
    ahorro: {metal: 0.15}
    bonus_mejora: 5
    bonus_desguace: 0.10
  orco:
    id: 3
    nombre: "Orco"
    calidad_oficio: {herreria: 3}
    bonus_dano: {tiers: [hierro_forjado, acero], tipos: [gran_hacha, espadon], pct: 10}
  draconiano:
    id: 4
    nombre: "Draconiano"
    calidad_oficio: {herreria: 5}
    calidad_estacion: {forja: 6}
    ahorro_combustible: 0.5
  vampiro:
    id: 5
    nombre: "Vampiro"
    calidad_oficio: {alquimia: 8}
    bonus_noche: 6
  triton:
    id: 6
    nombre: "Tritón"
    calidad_oficio: {cocina: 8}
    ahorro: {marino: 0.15}

etiquetas_material:
  metal:
    prefijos: ["lingote_", "placa_"]
  marino:
    ids: ["mat_perla_abisal"]
