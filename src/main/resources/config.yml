    acero: 600
    acero_negro: 1000
    mithril: 1600
  estilo:
    explorador: 160
    mercenario: 240
    guardia: 340
    caballero: 480
    barbaro: 520
    escamas: 560
    abisal: 540
  pieza:
    casco: 0.7
    peto: 1.0
    grebas: 0.9
    botas: 0.6
  item:
    escudo_madera: 220
    escudo_hierro: 420
    escudo_acero: 700
    escudo_mithril: 1400
    arco_corto: 380
    arco_largo: 520
    arco_elfico: 800
    ballesta_madera: 400
    ballesta_acero: 700
    tridente_marea: 520
    tridente_abisal: 900

# Comandos de consola al forjar (para BeautyQuests, logros, etc.). Placeholders: {jugador} {item} {calidad} {oficio}
al_forjar_comandos: []
#  - "scoreboard players add {jugador} forja_total 1"

# Recetas de crafteo VANILLA solo para conseguir las estaciones iniciales (ingredientes 100% vanilla).
recetas_vanilla:
  estacion_yunque:
    forma: ["III", "IAI", "III"]
    ingredientes: {I: IRON_INGOT, A: ANVIL}
  estacion_forja:
    forma: ["BBB", "BFB", "BBB"]
    ingredientes: {B: BRICK, F: BLAST_FURNACE}
  estacion_armeria:
    forma: ["SSS", "SLS", "SSS"]
    ingredientes: {S: STRING, L: LOOM}
  estacion_carpinteria:
    forma: ["LLL", "LFL", "LLL"]
    ingredientes: {L: OAK_LOG, F: FLETCHING_TABLE}
  estacion_joyeria:
    forma: ["GGG", "GSG", "GGG"]
    ingredientes: {G: GOLD_INGOT, S: SMITHING_TABLE}
  estacion_alquimia:
    forma: ["BBB", "BSB", "BBB"]
    ingredientes: {B: GLASS_BOTTLE, S: BREWING_STAND}
  estacion_cocina:
    forma: ["BBB", "BSB", "BBB"]
    ingredientes: {B: BRICK, S: SMOKER}
  estacion_curtideria:
    forma: ["SWS", "WBW", "SWS"]
    ingredientes: {S: STICK, W: OAK_PLANKS, B: BARREL}
  estacion_fundicion_t1:
    forma: ["BBB", "BFB", "BBB"]
    ingredientes: {B: BRICK, F: FURNACE}
  estacion_fundicion_t2:
    forma: ["NNN", "NBN", "NNN"]
    ingredientes: {N: NETHER_BRICK, B: BLAST_FURNACE}

# ==========================  CURTIDURÍA FÍSICA  ==========================
# El bastidor de curtidor (estación curtideria) funciona en el mundo: piel -> descarnar -> raspar -> cal -> tanino -> secado.
# Los baños (cal viva y tanino vegetal) se preparan con el menú (agáchate con la mano vacía y el bastidor libre).
curtiduria_fisica:
  activa: true               # false = vuelve al menú antiguo de "Preparación de pieles"
  capacidad: 4               # pieles iguales que caben a la vez en el bastidor
  golpes_descarnar: 6        # usos de la herramienta para descarnar
  golpes_raspar: 5           # usos de la herramienta para raspar
  cal_seg: 30                # baño de cal
  tanino_seg: 45             # baño de tanino
  secado_seg: 40             # secado en el bastidor
  xp_por_piel: 12            # XP de Curtiduría por cada piel curtida
  prob_calidad_baja: 0.15    # probabilidad de que el cuero salga una calidad por debajo de la de tu nivel
  herramientas_descarnar: [SHEARS, STONE_SWORD, IRON_SWORD, STONE_AXE, IRON_AXE]
  herramientas_raspar: [BRUSH, STONE_SHOVEL, IRON_SHOVEL, STONE_HOE, IRON_HOE]

# ==========================  MODELOS 3D DE LAS ESTACIONES (BetterModel)  ==========================
# Si BetterModel está instalado y existen los modelos forja_estacion_* (carpeta bettermodel/Forja/models), cada estación
# se dibuja con su modelo animado. Si no, se usa el modelo del resource pack.
estaciones_bettermodel:
  activa: true
  rango: 48                  # distancia a la que se muestran los modelos
  giro_extra: 0              # grados extra si tus modelos miran hacia el lado contrario (0, 90, 180, 270)

# Modelo clásico de las estaciones (resource pack). Si la parte delantera (boca del horno) mira al lado contrario del jugador,
# pon 180 aquí (valores válidos: 0, 90, 180, 270) y reinicia.
estaciones_modelo:
  giro: 0
