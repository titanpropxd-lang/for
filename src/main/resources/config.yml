# =============================================================
#  Forja - configuración principal (recargable con /forja recargar)
# =============================================================
general:
  debug: false

# Al actualizar el plugin, los datos nuevos (items, recetas, razas, lang) sustituyen a los de plugins/Forja/, DEJANDO ANTES una
# copia en backup-<fecha>/. Tus ediciones van en archivos items/custom_*.yml o recipes/custom_*.yml (esos no se tocan).
# config.yml no se sobrescribe: solo se le añaden las claves nuevas.
actualizacion:
  sobrescribir_datos: true

seguridad:
  # Se genera sola. Firma el "Forjado por X" para que nadie pueda falsificarlo. NO la compartas ni la cambies.
  secreto: ""

forja:
  distancia_max: 6.0          # bloques: si te alejas más, la forja se interrumpe (se devuelven los materiales)
  tiempo_mult: 1.0            # multiplica TODOS los tiempos de forja (0.5 = el doble de rápido)
  dar_xp_raza: true           # da XP de raza (rz_qxp) al forjar piezas difíciles (campo xp_raza de la receta)
  xp_raza_mult: 1.0
  xp_raza_max_por_entrega: 5000

oficios:
  nivel_max: 50
  # XP necesaria para pasar del nivel N al N+1 = N * xp_a + xp_b   (curva media)
  xp_a: 25
  xp_b: 50
  xp_mejorar: 10     # se multiplica por el nivel de mejora alcanzado
  xp_reparar: 6
  xp_desguazar: 4

calidad:
  # Orden: Tosca, Común, Buena, Excelente, Maestra
  mult_stats: [0.85, 1.0, 1.07, 1.15, 1.25]
  mult_durabilidad: [0.8, 1.0, 1.1, 1.25, 1.5]
  nivel_min: [0, 0, 5, 15, 30]        # nivel de oficio mínimo para poder obtener cada calidad
  por_nivel_oficio: 1.2               # puntos de "score" por nivel de oficio
  por_5_niveles_raza: 2.0             # puntos por cada 5 niveles de raza (rz_lvl)
  dificultad_por_nivel_receta: 0.5    # recetas más difíciles dan menos calidad
  pesos:
    tosca_base: 40
    tosca_por_score: 0.7
    tosca_min: 5
    comun: 50
    buena_base: 5
    buena_por_score: 0.45
    excelente_inicio: 10
    excelente_por_score: 0.3
    maestra_inicio: 30
    maestra_por_score: 0.15

mejora:
  max: 5
  bonus_stat_por_nivel: 0.04          # +4% daño/defensa por cada +1
  nivel_min_oficio: [1, 10, 20, 30, 40]
  costes: [2, 3, 4, 6, 8]             # cantidad de material por cada paso (+1..+5)
  fuel: 1                             # carbón extra en oficios de herrería
  prob: [95, 85, 70, 50, 30]          # % de éxito base por paso
  prob_por_nivel_oficio: 0.3
  fallo_baja_niveles: 1               # si falla, baja este nº de niveles (nunca destruye el item)
  material:
    defecto: madera_noble
    tier:
      hierro_forjado: lingote_hierro_forjado
      acero: lingote_acero
      acero_negro: lingote_acero_negro
      mithril: lingote_mithril
    estilo:
      explorador: cuero_curtido
      mercenario: placa_bronce
      guardia: placa_hierro_forjado
      caballero: placa_acero
      barbaro: placa_acero
      escamas: mat_escamas_volcan
      abisal: mat_perla_abisal
    item:
      escudo_hierro: placa_hierro_forjado
      escudo_acero: placa_acero
      escudo_mithril: placa_mithril
      ballesta_acero: lingote_acero
      tridente_marea: lingote_plata
      tridente_abisal: lingote_mithril

reparar:
  max_materiales: 4        # materiales necesarios para reparar un item totalmente roto

desguace:
  porcentaje: 0.5          # fracción de materiales devuelta
  bonus_por_calidad: 0.05  # +5% por cada nivel de calidad sobre Tosca

razas_ajenas:
  permitir: true           # un jugador con raza puede usar recetas de otra raza, con penalización
  mult_materiales: 1.5     # +50% de materiales
  pasos_calidad: 1         # -1 nivel de calidad
  sin_raza_solo_basicas: true   # sin raza (rz_race=0) solo recetas básicas

accesorios:
  caer_al_morir: false

estaciones:
  proteger_explosiones: true

# Obtención de pieles especiales al derrotar criaturas (no sustituye los drops vanilla).
curtiduria:
  drops:
    WOLF: {item: mat_piel_lobo, probabilidad: 0.85, cantidad_min: 1, cantidad_max: 1}
    FOX: {item: mat_piel_zorro, probabilidad: 0.85, cantidad_min: 1, cantidad_max: 1}
    CAT: {item: mat_piel_felina, probabilidad: 0.65, cantidad_min: 1, cantidad_max: 1}
    OCELOT: {item: mat_piel_felina, probabilidad: 0.75, cantidad_min: 1, cantidad_max: 1}
    COW: {item: mat_piel_bovina, probabilidad: 0.9, cantidad_min: 1, cantidad_max: 2}
    SHEEP: {item: mat_piel_ovina, probabilidad: 0.85, cantidad_min: 1, cantidad_max: 1}
    HORSE: {item: mat_piel_equina, probabilidad: 0.8, cantidad_min: 1, cantidad_max: 1}
    DONKEY: {item: mat_piel_equina, probabilidad: 0.8, cantidad_min: 1, cantidad_max: 1}
    MULE: {item: mat_piel_equina, probabilidad: 0.8, cantidad_min: 1, cantidad_max: 1}
    LLAMA: {item: mat_piel_equina, probabilidad: 0.8, cantidad_min: 1, cantidad_max: 1}
    GOAT: {item: mat_piel_caprina, probabilidad: 0.85, cantidad_min: 1, cantidad_max: 1}

# ==========================  MESAS Y ESTACIONES  ==========================
# Al hacer clic derecho en un bloque listado se abre el hub visual de su estación.
# Las estaciones colocadas con objetos de Forja usan el mismo hub. Agachado = función vanilla directa.
mesas:
  modo: todas            # Compatibilidad con configuraciones antiguas; los bloques listados siempre se reconocen.
  atajo_agachado: true   # agachado + clic derecho abre la función vanilla sin menú (y permite colocar bloques)
  bloques:               # bloque: {tipo: mesa | estacion: <recetas> , vanilla: <cómo abrir la función normal>, activada: true|false}
    CRAFTING_TABLE:    {tipo: mesa, vanilla: workbench}
    ANVIL:             {estacion: yunque, vanilla: anvil}
    CHIPPED_ANVIL:     {estacion: yunque, vanilla: anvil}
    DAMAGED_ANVIL:     {estacion: yunque, vanilla: anvil}
    BLAST_FURNACE:     {estacion: forja, vanilla: contenedor}
    FURNACE:           {estacion: forja, vanilla: contenedor}
    SMOKER:            {estacion: cocina, vanilla: contenedor}
    LOOM:              {estacion: armeria, vanilla: loom}
    FLETCHING_TABLE:   {estacion: carpinteria}
    SMITHING_TABLE:    {estacion: joyeria, vanilla: smithing}
    BREWING_STAND:     {estacion: alquimia, vanilla: contenedor}
    CARTOGRAPHY_TABLE: {estacion: cartografia, vanilla: cartography}
    STONECUTTER:       {estacion: canteria, vanilla: stonecutter}
    GRINDSTONE:        {estacion: afilado, vanilla: grindstone}
    COMPOSTER:         {estacion: compostera}

# Mesa de crafteo: SOLO oficios de taller casero. El yunque, la forja, el horno de fundición, la joyería, la armería y la
# curtiduría son estaciones propias con su menú o su proceso físico (no aparecen en la mesa de crafteo).
mesa_crafteo:
  estaciones_permitidas: [carpinteria, cocina, cartografia, compostera]
  categorias_materias_primas: [Lingotes, Placas, Materiales, Moldes, Gemas, Metal líquido]

# Mensajes de las estaciones físicas (fundición y curtiduría): chat | actionbar | titulo.
# Por defecto "chat" para que no se pisen con el HUD de poderes de razas, que ocupa la action bar.
mensajes:
  estaciones_canal: chat

# ==========================  METALURGIA FÍSICA  ==========================
# El horno de fundición (estaciones fundicion_t1 y fundicion_t2) funciona en el mundo: lingote -> crisol, carbón -> calor,
# molde -> junto al crisol, mano vacía -> verter, esperar a que se enfríe y recoger la pieza con la mano.
clima:                         # clima de la forja
  activo: true
  solo_al_aire_libre: true     # solo afecta si no hay techo encima de la fundición
  lluvia_mult: 1.2             # la fundición tarda 20 % más con lluvia
  tormenta_mult: 1.35          # y 35 % más con tormenta
  tormenta_prob_especial: 0.10 # con tormenta, 10 % de que el rayo temple la pieza y salga una extra
fundicion:
  fisica: true                 # false = vuelve al menú antiguo de "Metal líquido"
  capacidad: 4                 # lingotes que caben en el crisol
  vertido_seg: 4               # duración del vertido
  velocidad_t2: 1.5            # el alto horno medieval II calienta más rápido
  tiers_t1: [cobre, bronce, hierro_forjado, acero]
  tiers_t2: [cobre, bronce, hierro_forjado, acero, plata, acero_negro, mithril, adamantita]
  combustible_ticks:           # material vanilla: ticks de calor que aporta una unidad (20 ticks = 1 s)
    COAL: 1600
    CHARCOAL: 1600
    COAL_BLOCK: 16000
  calentamiento_seg:           # segundos para fundir (con el crisol a medias; más carga = más tiempo)
    cobre: 8
    bronce: 10
    hierro_forjado: 14
    acero: 18
    plata: 16
    acero_negro: 22
    mithril: 30
    adamantita: 36
  enfriamiento_seg:            # segundos que tarda el metal en el molde en solidificar
    cobre: 8
    bronce: 10
    hierro_forjado: 12
    acero: 15
    plata: 12
    acero_negro: 18
    mithril: 22
    adamantita: 26

# Estilo de los menús: custom = fondo violeta/dorado del resourcepack de Forja · vanilla = cofre normal (sin resourcepack)
gui:
  estilo: custom

# Munición: multiplicador de daño
flechas:
  flecha_elfica: 1.3
  flecha_acero: 1.2

