name: Forja
version: ${project.version}
main: com.servidor.forja.ForjaPlugin
api-version: '1.21'
description: Oficios, estaciones de forja, items medievales, calidades y bonificaciones por raza.
author: Servidor
softdepend: [PlaceholderAPI, RazasGUI, Citizens, BeautyQuests]
commands:
  forja:
    description: Administración de Forja
    usage: /forja <dar|recargar|nivel|receta|debug|lista|abrir>
    aliases: [forge]
  oficios:
    description: Ver tus oficios y niveles
    usage: /oficios
    aliases: [oficio, profesiones]
  accesorios:
    description: Abrir tus slots de accesorios
    usage: /accesorios
    aliases: [accesorio, acc]
permissions:
  forja.usar:
    description: Usar estaciones de trabajo
    default: true
  forja.accesorios:
    description: Usar /accesorios
    default: true
  forja.mesa:
    description: Usar el menú de la mesa de crafteo
    default: true
  forja.admin:
    description: Administrar Forja
    default: op
  forja.oficio.herreria:
    default: true
  forja.oficio.armeria:
    default: true
  forja.oficio.carpinteria:
    default: true
  forja.oficio.joyeria:
    default: true
  forja.oficio.alquimia:
    default: true
  forja.oficio.cocina:
    default: true
  forja.oficio.curtiduria:
    default: true
